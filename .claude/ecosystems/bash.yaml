# Shell in this repository: .claude/cloud-bootstrap.sh (standards-synced) and
# .cursor/install.sh. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# Lint is the check-scripts-and-manifests job of
# .github/workflows/pr-require-checks.yml (:84-106): shellcheck (:96-97) and
# bash -n (:98-102) over both scripts. Commands run from the repository root.
enabled: true
globs: ["*.sh", "*.bash"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: |
  rc=0
  shellcheck .claude/cloud-bootstrap.sh .cursor/install.sh || rc=1
  bash -n .claude/cloud-bootstrap.sh || rc=1
  bash -n .cursor/install.sh || rc=1
  test "$rc" -eq 0
fix-cmd: null
code-fix-cmd: null
opt-in: "shellcheck and bash -n always apply to CI's two shell files"
install-hint: "shellcheck with no version pin: CI uses the shellcheck preinstalled on the ubuntu-24.04 runner image and installs none (pr-require-checks.yml:87, :94-95), so no checksum is verified. winget install ShellCheck.ShellCheck | brew install shellcheck. bash -n needs bash."
tool-pin: {}
gates: []
notes: "No tool-pin: CI installs no shellcheck and uses the runner image's, so its version follows the ubuntu-24.04 image (pr-require-checks.yml:87, :94-95). check-cmd passes shellcheck the same two files and no flags, as CI does (:97); this repository tracks no .shellcheckrc. check-cmd lints CI's file list, not <files>: no job in this workflow has a path filter (:12-37), so CI runs both steps on every change; the steps read only the two scripts, which these globs select. Deviations: CI's bash -n step is a for loop in a run step with no shell key, which runs under bash -e and stops at the first file that fails (:98-102), and the job stops at its first failing step; check-cmd unrolls the loop, runs shellcheck and both bash -n calls, and fails when any fails. No shfmt: the bundled bash default (claude-code-plugins plugins/toolchain/reference/ecosystems/bash.yaml:7-8) runs shfmt -d and shfmt -w when .editorconfig declares shell style (:9), which this repository's .editorconfig does (.editorconfig:44-48); CI runs no shfmt, so check-cmd and fix-cmd replace those commands and fix-cmd is null. No test-cmd: CI runs no shell tests."
