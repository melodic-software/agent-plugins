version: 2

# This repository carries no build and no package manager, so the only
# ecosystem with a manifest here is `github-actions`: the SHA-pinned `uses:`
# refs in `.github/workflows/**`.
#
# `directory: /` scans `.github/workflows`. There is no `.github/actions/`
# here, so no glob target is needed; add one if composite actions land.
#
# Merge lanes follow the standards dependabot-policy component: the
# `vendor-actions` group (non-major only) is the auto-merge lane armed by
# pr-automerge-dependabot.yml; every other PR is reviewed by hand. A dependency
# joins the first group that matches it, so majors fall through to the
# reviewed `github-actions` group.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    # `ci-status` fails a pull-request title that is not Conventional Commits,
    # and `build` is in the accepted type list, so the prefix is what keeps
    # Dependabot's own pull requests passing the required check.
    commit-message:
      prefix: build
    # Delay version bumps so a compromised or yanked release is caught before
    # this repository adopts it; security updates bypass the cooldown.
    cooldown:
      default-days: 3
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
    # Every melodic-software/ci-workflows ref (reusable workflows AND composite
    # actions) moves only through deliberate reviewed PRs per the standards
    # runner-policy selector-revision lockstep, so all of them are ignored here.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/*"
