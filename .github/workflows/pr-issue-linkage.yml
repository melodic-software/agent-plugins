name: pr-issue-linkage

# Metadata-only caller for the organization-required issue-linkage check.
# pull_request_target uses the protected base-branch definition; the reusable
# refetches the PR body through the API and does not execute PR-head code.
on:
  # zizmor: ignore[dangerous-triggers] metadata-only gate; rationale above
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-issue-linkage:
    permissions:
      pull-requests: read
      actions: read
    uses: melodic-software/ci-workflows/.github/workflows/pr-issue-linkage.yml@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
    with:
      runner: ubuntu-24.04
